<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#141311" />
    <title>L'Architecte Sonore · Hors ligne</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #141311; color: #f3efe6; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { max-width: 460px; }
      .mark { width: 48px; height: 48px; border: 1px solid #e8d7a8; border-radius: 50%; display: grid; place-items: center; color: #e8d7a8; }
      .mark::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
      h1 { font-family: Georgia, serif; font-size: 2rem; font-weight: 500; margin: 32px 0 12px; }
      p { color: #9a9488; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>Le studio est hors ligne.</h1>
      <p>Reconnecte-toi pour composer. Tes partitions déjà enregistrées restent dans l’historique de cet appareil.</p>
    </main>
  </body>
</html>
